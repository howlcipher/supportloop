<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" role="img" aria-labelledby="title desc"><title id="title">From status to supported outcome</title><desc id="desc">An objective and visible support events lead to an evidence check, separating outcome, decision and procedure while preserving unknowns.</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#b8c7b5"/></pattern></defs><rect x="1" y="1" width="558" height="468" rx="4" fill="#eef1e7" stroke="#cbd6c6"/><rect x="1" y="1" width="558" height="468" fill="url(#grid)"/><g font-family="sans-serif" fill="#183c37"><text x="30" y="36" font-size="10" letter-spacing="2">RESOLUTION INTEGRITY / CONCEPTUAL MODEL</text><path d="M280 119v26m0 60v34m0 68v31m-170 0h340M110 338v21m170-21v21m170-21v21" stroke="#62806b" stroke-width="1.5" fill="none"/><rect x="117" y="64" width="326" height="55" rx="2" fill="#f9faf4" stroke="#b7c6b1"/><text x="280" y="87" text-anchor="middle" font-size="10" letter-spacing="1.4">CUSTOMER OBJECTIVE</text><text x="280" y="105" text-anchor="middle" font-size="12">What was the person trying to achieve?</text><rect x="39" y="145" width="482" height="60" fill="#f9faf4" stroke="#b7c6b1"/><text x="280" y="168" text-anchor="middle" font-size="10" letter-spacing="1.5">VISIBLE SUPPORT EVENTS</text><text x="280" y="190" text-anchor="middle" font-size="14">Answered   /   Closed   /   Denied</text><rect x="152" y="239" width="256" height="68" fill="#123f3b"/><text x="280" y="267" text-anchor="middle" fill="#f7f6f0" font-size="15">Evidence check</text><text x="280" y="288" text-anchor="middle" fill="#cde2c7" font-size="11">What do the observations support?</text><g font-size="11" text-anchor="middle"><rect x="39" y="359" width="142" height="43" fill="#e0ead8" stroke="#9cb397"/><text x="110" y="385">Outcome</text><rect x="209" y="359" width="142" height="43" fill="#e0ead8" stroke="#9cb397"/><text x="280" y="385">Decision</text><rect x="379" y="359" width="142" height="43" fill="#e0ead8" stroke="#9cb397"/><text x="450" y="385">Procedure</text></g><circle cx="45" cy="439" r="4" fill="#9e7023"/><text x="59" y="443" font-size="11">Missing evidence remains unknown.</text></g></svg>
